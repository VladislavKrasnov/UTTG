name: uttg

x-common-env: &common-env
  UTTG_ENVIRONMENT: ${UTTG_ENVIRONMENT:-development}
  UTTG_DATABASE_URL: ${UTTG_DATABASE_URL:?Set UTTG_DATABASE_URL}
  UTTG_VALKEY_URL: valkey://valkey:6379/0
  UTTG_NATS_URL: nats://nats:4222
  UTTG_IP_FINGERPRINT_SECRET: ${UTTG_IP_FINGERPRINT_SECRET:?Set UTTG_IP_FINGERPRINT_SECRET}
  UTTG_WEBHOOK_ENCRYPTION_KEY: ${UTTG_WEBHOOK_ENCRYPTION_KEY:?Set UTTG_WEBHOOK_ENCRYPTION_KEY}
  UTTG_TRUSTED_PROXIES: 172.16.0.0/12
  UTTG_CORS_ORIGINS: ${UTTG_CORS_ORIGINS:-https://uttg.example.com}
  UTTG_DATABASE_POOL_SIZE: ${UTTG_DATABASE_POOL_SIZE:-10}
  UTTG_DATABASE_MAX_OVERFLOW: ${UTTG_DATABASE_MAX_OVERFLOW:-5}
  UTTG_DATABASE_POOL_TIMEOUT_SECONDS: ${UTTG_DATABASE_POOL_TIMEOUT_SECONDS:-2}
  UTTG_DATABASE_STATEMENT_TIMEOUT_MS: ${UTTG_DATABASE_STATEMENT_TIMEOUT_MS:-3000}
  UTTG_NASA_API_KEY: ${UTTG_NASA_API_KEY:-}
  UTTG_SPACE_TRACK_IDENTITY: ${UTTG_SPACE_TRACK_IDENTITY:-}
  UTTG_SPACE_TRACK_PASSWORD: ${UTTG_SPACE_TRACK_PASSWORD:-}
  UTTG_THE_SPACE_DEVS_API_KEY: ${UTTG_THE_SPACE_DEVS_API_KEY:-}
  UTTG_ENABLE_CELESTRAK: ${UTTG_ENABLE_CELESTRAK:-true}
  UTTG_ENABLE_NOAA_SWPC: ${UTTG_ENABLE_NOAA_SWPC:-true}
  UTTG_ENABLE_JPL: ${UTTG_ENABLE_JPL:-true}
  UTTG_ENABLE_ESA: ${UTTG_ENABLE_ESA:-false}
  UTTG_ENABLE_SPACE_DEVS_PUBLIC_API: ${UTTG_ENABLE_SPACE_DEVS_PUBLIC_API:-true}

x-app: &app
  build: .
  init: true
  restart: unless-stopped
  environment:
    <<: *common-env
  read_only: true
  tmpfs:
    - /tmp:size=64m,noexec,nosuid
  security_opt:
    - no-new-privileges:true

services:
  migrate:
    <<: *app
    command: alembic upgrade head
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - ${UTTG_API_WORKERS:-2}
      - --loop
      - uvloop
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.uttg-api.rule=PathPrefix(`/`) && !Path(`/metrics`) && !PathPrefix(`/v1/admin`)
      - traefik.http.routers.uttg-api.entrypoints=web
      - traefik.http.services.uttg-api.loadbalancer.server.port=8000
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  worker:
    <<: *app
    command: python -m ingestion.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  scheduler:
    <<: *app
    command: python -m ingestion.scheduler
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  db:
    image: timescale/timescaledb:2.17.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: uttg
      POSTGRES_PASSWORD: ${UTTG_POSTGRES_PASSWORD:?Set UTTG_POSTGRES_PASSWORD}
      POSTGRES_DB: uttg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uttg -d uttg"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g

  valkey:
    image: valkey/valkey:8.0.0
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${UTTG_VALKEY_MAXMEMORY:-1gb}
      - --maxmemory-policy
      - volatile-lfu
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1280m

  nats:
    image: nats:2.10.22-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  reverse-proxy:
    image: traefik:v3.2.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --accesslog=true
      - --ping=true
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${UTTG_GRAFANA_ADMIN_PASSWORD:?Set UTTG_GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - 127.0.0.1:3000:3000
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  valkey_data:
  nats_data:
  prometheus_data:
  grafana_data:
