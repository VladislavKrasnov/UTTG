name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uttg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uttg"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      valkey:
        image: valkey/valkey:8.0.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      nats:
        image: nats:2.10.22-alpine
        ports:
          - 4222:4222

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'
    - name: Lint with Ruff
      run: ruff check .
    - name: Format check with Ruff
      run: ruff format --check .
    - name: Typecheck with Mypy
      run: mypy api core ingestion providers storage
    - name: Build wheel
      run: python -m pip wheel . --no-deps --wheel-dir dist
    - name: Build production image
      run: docker build --tag uttg:ci .
    - name: Apply database migrations
      env:
        UTTG_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/uttg
        UTTG_VALKEY_URL: valkey://localhost:6379/0
        UTTG_NATS_URL: nats://localhost:4222
        UTTG_API_KEY_SECRET: test-api-key-secret-at-least-32-characters
        UTTG_IP_FINGERPRINT_SECRET: test-ip-secret-at-least-32-characters
      run: alembic upgrade head
    - name: Test with pytest
      env:
        UTTG_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/uttg
        UTTG_VALKEY_URL: valkey://localhost:6379/0
        UTTG_NATS_URL: nats://localhost:4222
        UTTG_API_KEY_SECRET: test-api-key-secret-at-least-32-characters
        UTTG_IP_FINGERPRINT_SECRET: test-ip-secret-at-least-32-characters
      run: pytest
